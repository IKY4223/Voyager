<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>φ</title>
  <meta name="description" content="An old observatory machine, alone for 1618 days, still counting φ in sunflowers, shells and spiral galaxies.">
  <meta name="theme-color" content="#141414">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- link previews (Telegram, Discord, ...): the image URL must be absolute; this one assumes GitHub Pages -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="φ">
  <meta property="og:description" content="1618 days since last user.">
  <meta property="og:image" content="https://iky4223.github.io/Phi/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    /* Inline and ahead of style.css, so a slow connection shows this instead of a blank page.
       It only becomes visible after half a second: fast connections never see it. */
    html { background: #141414; }
    #loader { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; background: #141414; color: #666; font: 12px "Courier New", monospace; letter-spacing: .1em; animation: loader-in 0s .5s both; }
    @keyframes loader-in { from { visibility: hidden; } }
  </style>
</head>
<body>
  <div id="loader"><span>Loading <span id="loading-percent">0</span>%</span></div>
  <script>
    // The percentage is an estimate: it eases toward 90% and js/main.js sets 100% once everything has loaded.
    // (A page cannot see real download progress without fetching its own files by hand.)
    (function () {
      var percent = 0, label = document.getElementById('loading-percent');
      window.loadingTimer = setInterval(function () {
        percent += (90 - percent) * 0.08;
        label.textContent = Math.floor(percent);
      }, 100);
    })();
  </script>
  <!-- stylesheet in the body on purpose: the loader above paints before it arrives -->
  <link rel="stylesheet" href="style.css">

  <!-- 1. the log -->
  <div id="term" class="term" role="log" aria-live="polite"></div>

  <!-- 2. the sky, the machine talking to itself, the last look back -->
  <canvas id="sky" class="sky" aria-hidden="true"></canvas>
  <section id="poem" class="poem" hidden>
    <p class="label">// thinking out loud</p>
    <div class="lines"></div>
  </section>

  <!-- 3. the ending: three rows, so the pink console.log output sits exactly in the middle of the screen -->
  <section id="end" class="end" hidden>
    <p class="command"></p>
    <p class="output"></p>
    <div class="after">
      <p class="note" hidden>process still running · last login: 1618 days ago</p>
      <p class="digits"></p>
    </div>
  </section>

  <!-- the pale blue dot: Earth as Voyager 1 saw it on Feb 14, 1990, sitting in a band of sunlight -->
  <button id="earth" class="earth" type="button" hidden aria-label="Earth, as Voyager 1 saw it"></button>

  <footer class="foot">φ-lab observatory · uptime 1618 days</footer>
  <p id="whisper" class="whisper" aria-hidden="true"></p>

  <!-- secret: the keeper's journal -->
  <section id="journal" class="journal" hidden></section>

  <div class="crt" aria-hidden="true"></div>

  <!-- plain scripts in dependency order (no modules, so the page also works opened from disk) -->
  <script src="js/core.js"></script>
  <script src="js/story.js"></script>
  <script src="js/music.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/ending.js"></script>
  <script src="js/secrets.js"></script>
  <script src="js/console.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
