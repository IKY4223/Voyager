<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>φ</title>
  <meta name="description" content="An old observatory machine, alone for 1618 days, still counting φ in sunflowers, shells and spiral galaxies.">
  <meta name="theme-color" content="#141414">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- link previews (Telegram, Discord, ...): the image URL must be absolute, this assumes GitHub Pages -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="φ">
  <meta property="og:description" content="1618 days since last user.">
  <meta property="og:image" content="https://iky4223.github.io/Phi/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    /* inline + before style.css, so a slow connection shows this instead of a blank page */
    html { background: #141414; }
    #loader { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; background: #141414; color: #666; font: 12px "Courier New", monospace; letter-spacing: .1em; animation: loader-in 0s .5s both; }
    @keyframes loader-in { from { visibility: hidden; } }
  </style>
</head>
<body>
  <div id="loader"><span>Loading <span id="pct">0</span>%</span></div>
  <script>
    // shortcut: the percentage is estimated (eases toward 90%) until main.js sets 100%; real byte progress would need streamed fetches
    (function () {
      var p = 0, el = document.getElementById('pct');
      window.loadTimer = setInterval(function () { p += (90 - p) * 0.08; el.textContent = Math.floor(p); }, 100);
    })();
  </script>
  <!-- stylesheet in body: the loader above paints before it arrives -->
  <link rel="stylesheet" href="style.css">
  <div id="term" class="term" role="log" aria-live="polite"></div>

  <canvas id="sky" class="sky" aria-hidden="true"></canvas>

  <section id="poem" class="poem" hidden>
    <p class="label">// thinking out loud</p>
    <div class="lines"></div>
  </section>

  <section id="end" class="end" hidden>
    <!-- three rows: the pink console.log output sits exactly in the middle of the screen -->
    <div class="top"><h1>φ</h1><p class="num"></p></div>
    <p class="num"></p>
    <div class="bottom">
      <p class="note" hidden>process still running · last login: 1618 days ago</p>
      <p class="digits"></p>
    </div>
  </section>

  <footer class="foot">φ-lab observatory · uptime 1618 days</footer>
  <p id="whisper" class="whisper" aria-hidden="true"></p>
  <section id="journal" class="journal" hidden></section>
  <div class="crt" aria-hidden="true"></div>

  <script src="music.js"></script>
  <script src="main.js"></script>
</body>
</html>
